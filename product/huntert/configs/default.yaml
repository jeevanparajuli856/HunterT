# Reference HunterT runtime settings.
# The current CLI does not auto-load this file; it documents sensible defaults
# for operators packaging or scripting repeatable runs.

target: https://example.com
threads: 20
timeout: 10s
rate_limit: 0
method: GET
follow_redirects: false
insecure: false
max_depth: 3
prediction_limit: 128
max_requests: 1000
status_include:
  - 200
  - 204
  - 301
  - 302
  - 307
  - 308
  - 401
  - 403
model_bundle: runtime/bundles/default
output: text
