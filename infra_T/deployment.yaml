resources:
- name: ltsm-t4-transformer-vm
  type: compute.v1.instance
  properties:
    zone: us-central1-a
    machineType: zones/us-central1-a/machineTypes/n1-standard-8

    scheduling:
      provisioningModel: SPOT
      preemptible: true
      automaticRestart: false
      onHostMaintenance: TERMINATE
      instanceTerminationAction: STOP

    guestAccelerators:
    - acceleratorType: zones/us-central1-a/acceleratorTypes/nvidia-tesla-t4
      acceleratorCount: 1

    disks:
    - deviceName: boot
      type: PERSISTENT
      boot: true
      autoDelete: true
      initializeParams:
        diskSizeGb: 200
        diskType: zones/us-central1-a/diskTypes/pd-balanced
        sourceImage: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts

    networkInterfaces:
    - network: global/networks/default
      accessConfigs:
      - name: External NAT
        type: ONE_TO_ONE_NAT

    serviceAccounts:
    - email: default
      scopes:
      - https://www.googleapis.com/auth/cloud-platform

    tags:
      items:
      - ltsm
      - ssh

    metadata:
      items:
      - key: startup-script
        value: |
          #!/usr/bin/env bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git tmux htop python3-venv python3-pip ubuntu-drivers-common

          # Install NVIDIA driver for T4 if not already present.
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            ubuntu-drivers autoinstall || true
          fi
