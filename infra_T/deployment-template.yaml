resources:
- name: ${DEPLOYMENT_NAME}-vm
  type: compute.v1.instance
  properties:
    zone: ${ZONE}
    machineType: zones/${ZONE}/machineTypes/${MACHINE_TYPE}

    scheduling:
      provisioningModel: SPOT
      preemptible: true
      automaticRestart: false
      onHostMaintenance: TERMINATE
      instanceTerminationAction: STOP

    guestAccelerators:
    - acceleratorType: zones/${ZONE}/acceleratorTypes/nvidia-l4
      acceleratorCount: 1

    disks:
    - deviceName: boot
      type: PERSISTENT
      boot: true
      autoDelete: true
      initializeParams:
        diskSizeGb: ${DISK_SIZE_GB}
        diskType: zones/${ZONE}/diskTypes/pd-ssd
        # Deep Learning VM — CUDA 11.8 + NVIDIA drivers pre-installed.
        # Required for L4 (Ada Lovelace, compute capability 8.9).
        sourceImage: projects/deeplearning-platform-release/global/images/family/pytorch-latest-gpu-ubuntu-2004-py310

    networkInterfaces:
    - network: global/networks/default
      accessConfigs:
      - name: External NAT
        type: ONE_TO_ONE_NAT

    serviceAccounts:
    - email: default
      scopes:
      - https://www.googleapis.com/auth/cloud-platform

    tags:
      items:
      - ltsm
      - ssh

    metadata:
      items:
      - key: install-nvidia-driver
        value: "True"
      - key: startup-script
        value: |
          #!/usr/bin/env bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -qq
          apt-get install -y --no-install-recommends git tmux htop gettext-base python3-venv

          # Verify L4 GPU is visible (DLVM pre-installs drivers)
          nvidia-smi || { echo "ERROR: GPU not visible"; exit 1; }
          echo "VM ready. GPU: $(nvidia-smi --query-gpu=name --format=csv,noheader)"
