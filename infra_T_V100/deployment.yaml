resources:
- name: ltsm-v100-transformer-vm
  type: compute.v1.instance
  properties:
    zone: us-central1-a
    machineType: zones/us-central1-a/machineTypes/n1-standard-8

    scheduling:
      provisioningModel: SPOT
      preemptible: true
      automaticRestart: false
      onHostMaintenance: TERMINATE
      instanceTerminationAction: STOP

    guestAccelerators:
    - acceleratorType: zones/us-central1-a/acceleratorTypes/nvidia-tesla-v100
      acceleratorCount: 1

    disks:
    - deviceName: boot
      type: PERSISTENT
      boot: true
      autoDelete: true
      initializeParams:
        diskSizeGb: 200
        diskType: zones/us-central1-a/diskTypes/pd-ssd
        # GCP Deep Learning VM — CUDA 12.8, NVIDIA driver 570, Ubuntu 22.04.
        # Works for V100 (cu121 torch wheels run on any driver >= 520).
        # List available: gcloud compute images list --project deeplearning-platform-release --no-standard-images --format="value(family)" | grep pytorch
        sourceImage: projects/deeplearning-platform-release/global/images/family/pytorch-2-7-cu128-ubuntu-2204-nvidia-570

    networkInterfaces:
    - network: global/networks/default
      accessConfigs:
      - name: External NAT
        type: ONE_TO_ONE_NAT

    serviceAccounts:
    - email: default
      scopes:
      - https://www.googleapis.com/auth/cloud-platform

    tags:
      items:
      - ltsm
      - ssh

    metadata:
      items:
      - key: install-nvidia-driver
        value: "True"
      - key: startup-script
        value: |
          #!/usr/bin/env bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -qq
          apt-get install -y --no-install-recommends git tmux htop gettext-base python3-venv

          # Verify V100 GPU is visible (DLVM pre-installs drivers)
          nvidia-smi || { echo "ERROR: GPU not visible"; exit 1; }
          echo "VM ready. GPU: $(nvidia-smi --query-gpu=name --format=csv,noheader)"
